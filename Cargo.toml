# SPDX-License-Identifier: EUPL-1.2
[workspace]
resolver = "3"
members = [
    "crates/skat-core",
    "crates/skat-analysis",
    "crates/skat-nn",
    "crates/skat-ai",
    "crates/skat-coach",
    "crates/skat-app",
    "crates/gui-egui",
    "tools/cardgen",
    "tools/notices",
    "tools/nn-train",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "EUPL-1.2"
repository = "https://github.com/naturelle137/grand-coach"
publish = false

[workspace.dependencies]
skat-core = { path = "crates/skat-core" }
skat-nn = { path = "crates/skat-nn" }
skat-analysis = { path = "crates/skat-analysis" }
skat-ai = { path = "crates/skat-ai" }
skat-coach = { path = "crates/skat-coach" }
skat-app = { path = "crates/skat-app" }
rand_chacha = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Neural networks (D-11). Inference uses the pure-Rust CPU backend Flex;
# tools/nn-train adds autodiff, optimisers and Vulkan.
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex"] }
sha2 = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The seeded random-game test plays 10,000 games; light optimisation keeps
# `cargo test` fast while staying debuggable.
[profile.test]
opt-level = 1
