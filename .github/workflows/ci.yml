# SPDX-License-Identifier: EUPL-1.2
name: CI

# Shared verification tiers (D-30). ci-ok remains the required check.
# Only main saves caches; PRs restore without evicting the shared cache.

on:
  pull_request:
  push:
    branches: [main]
  # Also dispatched by implement-issue.yml: PRs opened with GITHUB_TOKEN do
  # not trigger `pull_request` runs.
  workflow_dispatch:
    inputs:
      deep:
        description: 'Also run the deep random-game soak'
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 1' # complete platforms + weekly deep
    - cron: '23 3 * * 0,2-6' # complete platforms every other night

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHECK_STRICT: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      gui: ${{ steps.detect.outputs.gui }}
      full: ${{ steps.detect.outputs.full }}
      regression: ${{ steps.detect.outputs.regression }}
      deep: ${{ steps.detect.outputs.deep }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DEEP: ${{ inputs.deep }}
        run: |
          args=(--base "$BASE" --event "$EVENT" --schedule "$SCHEDULE")
          if [ "$DEEP" = true ]; then args+=(--deep); fi
          scripts/check.sh route "${args[@]}" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Node (for npx markdownlint-cli2) and shellcheck are preinstalled.
      - run: scripts/check.sh lint

  portable:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh pr

  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      NATIVE_RENDER_DIR: native-render
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh native
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: native-render-Windows
          path: native-render/launch.png
          if-no-files-found: error

  regression:
    needs: changes
    if: needs.changes.outputs.regression == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh regression

  complete:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    name: complete (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh complete
        shell: bash

  # The declared `rust-version` must stay true.
  msrv:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace --all-targets --all-features

  # Renders the frontend headlessly and keeps the PNGs as a run artifact
  # (D-45): lavapipe on Linux, WARP on Windows. Informational, not part of
  # `ci-ok`.
  screenshots:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    name: screenshots (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run --locked -p gui-egui --example screenshots -- screenshots
        shell: bash
      - name: Hash each screenshot
        shell: bash
        run: python3 -c "import hashlib,pathlib; p=pathlib.Path('screenshots'); (p/'SHA256SUMS').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.glob('*.png'))), encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ runner.os }}
          path: screenshots/

  deep:
    needs: changes
    if: needs.changes.outputs.deep == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/check.sh deep

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, portable, native, msrv, regression, complete, deep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: All mandatory results match classification
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: scripts/check.sh ci-ok
