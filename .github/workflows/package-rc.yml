# SPDX-License-Identifier: EUPL-1.2
name: RC packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          key: rc-1.95.0
          cache-on-failure: true
      - name: Linux display and runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libgl1 libwayland-egl1 libxkbcommon0 libxkbcommon-x11-0
      - name: Windows test-only software OpenGL prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/mesa.7z"
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/26.2.6/mesa3d-26.2.6-release-mingw.7z -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'da0f71d9181b672c1918f3c342f11118c687f6059a46b16502845160733cc388') { throw 'Mesa checksum mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP/mesa" -y
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          "GC_TEST_MESA=$env:RUNNER_TEMP/mesa/x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Archive contract and failure cases
        run: python3 -B scripts/package_test.py
      - name: Fetch locked build inputs
        run: cargo fetch --locked
      - name: Build offline and verify deterministic archive
        run: python3 -B scripts/package.py build --out dist
      - name: Native packaged launch and lifecycle smoke
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET xvfb-run -a -s '-screen 0 1600x1000x24' python3 -B scripts/package.py smoke dist/*.tar.gz --out evidence
          else
            GALLIUM_DRIVER=llvmpipe python3 -B scripts/package.py smoke dist/*.zip --out evidence --windows-mesa "$GC_TEST_MESA"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/
            evidence/
          if-no-files-found: error
          retention-days: 14
