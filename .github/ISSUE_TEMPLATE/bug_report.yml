# SPDX-License-Identifier: EUPL-1.2
name: 🐞 Bug report
description: Something does not work as expected (wrong rule, crash, display error).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: After a Grand Hand game the score was 72, but it should be 96.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we see it ourselves? A game seed or save helps a lot if you have one.
      placeholder: |
        1. Start a new game with seed ...
        2. Bid up to ...
        3. ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Version and system
      placeholder: Grand-Coach 0.1.0, Windows 11
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, logs, ISkO rule reference, ...

  - type: textarea
    id: verification_and_manual_handoff
    attributes:
      label: Verification and manual release validation (D-61)
      description: >-
        Required automated checks stay due during development. Before technical
        closure, add or extend owned manual scenarios in release register #81
        and link the handoff. Manual checks stay pending until before public 1.0;
        #13 readiness requires actual #81 and applicable #54 results.
      placeholder: |
        Automated checks and evidence:
        Manual owner / #81 entry:
        Functions/platforms and reproducible steps:
        Required evidence / status (pending, or actual result link; n/a with reason):
